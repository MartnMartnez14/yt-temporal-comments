<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="YT Temporal Comments">
  <!-- Marca de la extensión: misma forma y degradé que .ytt-brand-mark del panel.
       Fuente de icon48.png e icon128.png; los tamaños chicos salen de icon-small.svg. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="128" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ee6f6"/>
      <stop offset="0.52" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#ff6ad5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="29" ry="29" fill="url(#brand)"/>
  <path d="M50 38 L50 90 L92 64 Z" fill="#0a0c14" stroke="#0a0c14" stroke-width="6" stroke-linejoin="round"/>
</svg>
